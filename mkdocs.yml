
not_in_nav:  |
markdown_extensions:
  - pymdownx.betterem
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - markdown.extensions.admonition
  - toc:
      permalink: "\u2693\uFE0E"
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
plugins:
   - search
   - awesome-nav
site_name: Rickypedia
site_url: https://rdnator555.github.io/Rickypedia
theme:
  font:
    text: Merriweather Sans
  logo: img/favicon.ico
  favicon: img/favicon.ico
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.instant
    - toc.follow
    - content.code.copy
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: teal
      accent: lime

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: purple
      accent: deep orange
